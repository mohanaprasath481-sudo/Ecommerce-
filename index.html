<!DOCTYPE html>
<html>
<head>
    <title>Classified Web Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f4f8;
        }

        header {
            background: #243b55;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 25px auto;
        }

        .form-box, .search-box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #243b55;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }

        .ads {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        .card h3 {
            color: #243b55;
        }

        .price {
            color: green;
            font-weight: bold;
            font-size: 20px;
        }

        .delete {
            background: #e63946;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>CLASSIFIED ADS</h1>
    <p>Buy, Sell and Advertise Online</p>
</header>

<div class="container">

    <div class="form-box">
        <h2>Post Your Advertisement</h2>

        <input type="text" id="title"
               placeholder="Advertisement Title">

        <select id="category">
            <option value="">Select Category</option>
            <option>Electronics</option>
            <option>Vehicles</option>
            <option>Furniture</option>
            <option>Books</option>
            <option>Others</option>
        </select>

        <input type="number" id="price"
               placeholder="Enter Price">

        <textarea id="description"
                  placeholder="Enter Description"></textarea>

        <button onclick="addAd()">Post Advertisement</button>
    </div>

    <div class="search-box">
        <h2>Search Advertisements</h2>

        <input type="text" id="search"
               placeholder="Search products..."
               oninput="displayAds()">

        <select id="filter" onchange="displayAds()">
            <option value="">All Categories</option>
            <option>Electronics</option>
            <option>Vehicles</option>
            <option>Furniture</option>
            <option>Books</option>
            <option>Others</option>
        </select>
    </div>

    <h2>Available Advertisements</h2>

    <div class="ads" id="adsList"></div>

</div>

<script>

let ads = JSON.parse(localStorage.getItem("ads")) || [];

function saveAds() {
    localStorage.setItem("ads", JSON.stringify(ads));
}

function addAd() {

    let title = document.getElementById("title").value.trim();
    let category = document.getElementById("category").value;
    let price = document.getElementById("price").value;
    let description = document.getElementById("description").value.trim();

    if (!title || !category || !price || !description || Number(price) <= 0) {
        alert("Please enter all valid details!");
        return;
    }

    let ad = {
        id: Date.now(),
        title: title,
        category: category,
        price: price,
        description: description
    };

    ads.push(ad);
    saveAds();

    document.getElementById("title").value = "";
    document.getElementById("category").value = "";
    document.getElementById("price").value = "";
    document.getElementById("description").value = "";

    displayAds();

    alert("Advertisement Posted Successfully!");
}

function displayAds() {

    let search = document.getElementById("search").value.toLowerCase();
    let filter = document.getElementById("filter").value;

    let list = document.getElementById("adsList");

    list.innerHTML = "";

    let filteredAds = ads.filter(ad => {

        return ad.title.toLowerCase().includes(search) &&
        (filter === "" || ad.category === filter);

    });

    if (filteredAds.length === 0) {
        list.innerHTML = "<p>No advertisements found.</p>";
        return;
    }

    filteredAds.forEach(ad => {

        let card = document.createElement("div");
        card.className = "card";

        let heading = document.createElement("h3");
        heading.textContent = ad.title;

        let category = document.createElement("p");
        category.textContent = "Category: " + ad.category;

        let price = document.createElement("p");
        price.className = "price";
        price.textContent = "₹" + ad.price;

        let description = document.createElement("p");
        description.textContent = ad.description;

        let deleteBtn = document.createElement("button");
        deleteBtn.className = "delete";
        deleteBtn.textContent = "Delete";
        deleteBtn.onclick = () => deleteAd(ad.id);

        card.append(heading, category, price, description, deleteBtn);
        list.appendChild(card);

    });
}

function deleteAd(id) {
    ads = ads.filter(ad => ad.id !== id);
    saveAds();
    displayAds();
}

displayAds();

</script>

</body>
</html>
